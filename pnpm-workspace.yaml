# pnpm settings (this repo is a single package, not a workspace).
# Electron downloads its binary on first run, so it needs no install script.
allowBuilds:
  esbuild: true
  electron-winstaller: false

# Keep every Tiptap package on the same release: @tiptap/react's optional menus would
# otherwise float to a newer one than the core they plug into.
overrides:
  "@tiptap/extension-bubble-menu": 3.31.3
  "@tiptap/extension-floating-menu": 3.31.3

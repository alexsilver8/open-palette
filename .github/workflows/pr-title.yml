name: pr-title

# Pull requests are squash-merged with their title as the commit subject, and `pnpm release` reads those
# subjects to pick the version, so the title has to follow Conventional Commits: "feat: …", "fix(notes): …".
# Required to merge into main. It runs again whenever the title is edited.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    # Not on Dependabot's pull requests: they only update dependencies, which CI verifies. (A skipped job counts as
    # passing for a required check, so they can still merge.)
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node scripts/check-commits.mjs --title "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}

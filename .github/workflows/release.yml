name: release

# release-please keeps a "release PR" open that bumps the version and updates
# CHANGELOG.md from Conventional Commits. Merging it tags and publishes a GitHub Release.
# With a RELEASE_PLEASE_TOKEN secret, the release PR also merges itself once its checks pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT in RELEASE_PLEASE_TOKEN lets CI run on the release PR.
          # GITHUB_TOKEN works too, but PRs it opens don't trigger workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Auto-merge waits for the required checks, which only run on pushes made with the PAT,
      # and main's ruleset wants the PR up to date. So the release PR is first brought up to
      # date with main using the PAT, then set to merge. That merge is made with the PAT too,
      # so it starts this workflow again, which tags the release and builds the installers.
      # The PR is found by its label: release-please doesn't report a PR it left unchanged.
      - name: Merge the release PR once its checks pass
        if: ${{ steps.release.outputs.release_created != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No RELEASE_PLEASE_TOKEN secret, so the release PR is left for you to merge."
            exit 0
          fi
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' --json number --jq '.[].number')
          for pr in $prs; do
            # GitHub refuses when the PR is already up to date; that's fine.
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/update-branch" --silent || true
            gh pr merge "$pr" --auto --squash --repo "$GITHUB_REPOSITORY"
            echo "Release PR #$pr will merge once its checks pass."
          done

  # Build installers on each OS whenever a release is cut, and attach them to it.
  build:
    name: build (${{ matrix.os }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installers
        run: pnpm run dist
        env:
          # No signing certificates yet; see README "Install".
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          shopt -s nullglob
          files=(release/*/*.dmg release/*/*.zip release/*/*.exe release/*/*.AppImage release/*/*.deb release/*/latest*.yml)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
